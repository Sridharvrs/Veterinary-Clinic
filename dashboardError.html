<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found — Paws & Claws Veterinary Clinic</title>

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/error.css">
</head>

<body>

  <main class="error-page">

    <!-- Decorative Background -->
    <div class="error-orb orb-one"></div>
    <div class="error-orb orb-two"></div>
    <div class="error-grid"></div>

    <div class="error-container">

      <!-- Illustration -->
      <div class="error-visual">

        <div class="error-number">
          <span>4</span>

          <div class="paw-zero">
            <div class="paw-main">🐾</div>
          </div>

          <span>4</span>
        </div>

        <div class="floating-paw paw-one">🐾</div>
        <div class="floating-paw paw-two">🐾</div>
        <div class="floating-paw paw-three">🐾</div>

      </div>


      <!-- Content -->
      <div class="error-content">

        <span class="eyebrow">Oops! Lost in the pack</span>

        <h1>
          This page
          <span>ran away.</span>
        </h1>

        <p>
          Looks like the page you're looking for has wandered off.
          Don't worry — we'll help you find your way back to
          Stackly.
        </p>

        <div class="error-actions">

          <a onclick="history.back()" class="btn btn-primary">
            Back to Dashboard

            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            >
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </a>

          <a href="index.html" class="btn btn-ghost">
            Go home
          </a>

        </div>

        <div class="error-help">

          <span class="help-icon">✦</span>

          <div>
            <strong>Need a little help?</strong>
            <span>Visit our clinic or book a veterinary appointment.</span>
          </div>

        </div>

      </div>

    </div>


    <!-- Bottom Brand -->
    <a href="index.html" class="error-brand">

      <span class="brand-mark">
        <svg
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/>
        </svg>
      </span>

      <span>
        Stackly
      </span>

    </a>

  </main>

</body>
</html>

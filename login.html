<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Stackly Veterinary Clinic</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<!-- ============ LOGIN WRAPPER ============ -->
<div class="login-page">
  <!-- LEFT: brand / image panel -->
  <div class="login-art">
    <img src="https://images.pexels.com/photos/6235648/pexels-photo-6235648.jpeg?auto=compress&cs=tinysrgb&h=900&w=900" alt="Vet with Pomeranian">
    <div class="la-overlay"></div>
    <div class="la-content">
      <a href="index.html" class="la-brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg></span>
        <span class="brand-name">Paws <span>&amp;</span> Claws</span>
      </a>
      <div class="la-quote reveal">
        <h2>Welcome back to the pack.</h2>
        <p>Manage appointments, view your pet's records, and chat with your vet — all in one warm, friendly portal.</p>
      </div>
      <div class="la-paws">🐾</div>
    </div>
  </div>

  <!-- RIGHT: form panel -->
  <div class="login-panel">
    <!-- close button (top-right) -->
    <a href="index.html" class="login-close" aria-label="Close and return home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </a>

    <div class="login-box">
      <span class="eyebrow">Client Portal</span>
      <h1>Sign in to your <span class="hl">account</span></h1>
      <p class="login-sub">Choose how you'd like to continue.</p>

      <!-- ROLE SELECTOR -->
      <div class="role-selector" id="roleSelector">
        <button type="button" class="role-card active" data-role="pet-owner">
          <div class="role-ic">🐾</div>
          <div class="role-text"><strong>Pet Owner</strong><span>Book visits &amp; records</span></div>
          <div class="role-check">✓</div>
        </button>
        <button type="button" class="role-card" data-role="staff">
          <div class="role-ic">🩺</div>
          <div class="role-text"><strong>Staff / Vet</strong><span>Manage patients</span></div>
          <div class="role-check">✓</div>
        </button>
      </div>

      <!-- FORM -->
      <form class="login-form" id="loginForm">
        <div class="field">
          <label id="emailLabel">Email Address</label>
          <input type="email" id="email" required placeholder="you@email.com">
        </div>
        <div class="field">
          <label>Password</label>
          <div class="pwd-wrap">
            <input type="password" id="password" required placeholder="••••••••">
            <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-extra">
          <label class="check"><input type="checkbox"> <span>Remember me</span></label>
          <a href="#" class="link">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block login-btn">
          <span id="btnText">Sign in as Pet Owner</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
        <div class="login-error" id="loginError"></div>
      </form>

      <div class="login-divider"><span>or</span></div>
      <button class="social-btn" id="googleBtn">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
        Continue with Google
      </button>

      <p class="login-foot">New to Stackly? <a href="#" class="link">Create an account</a></p>
    </div>
  </div>
</div>

<!-- floating decorative paws -->
<div class="float-paw fp1">🐾</div>
<div class="float-paw fp2">🐾</div>
<div class="float-paw fp3">🐾</div>

<script src="js/shared.js"></script>
<script src="js/login.js"></script>
</body>
</html>
